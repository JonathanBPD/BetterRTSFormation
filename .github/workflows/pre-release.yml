name: Pre-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build-tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build merged artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist

          gradle_cmd="gradle"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            gradle_cmd="./gradlew"
          fi

          "$gradle_cmd" --no-daemon clean deploy

      - name: Verify mod descriptor in jar
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(dist/*.jar)

          if [ ${#jars[@]} -eq 0 ]; then
            echo "ERROR: No JAR files found in dist/" >&2
            exit 1
          fi

          for jar_file in "${jars[@]}"; do
            if ! unzip -l "$jar_file" | grep -qE 'mod\.(json|hjson)'; then
              echo "ERROR: $jar_file is missing mod.json/mod.hjson" >&2
              exit 1
            fi
          done

          echo "All JAR files contain a mod descriptor"

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "preview-${{ github.run_number }}-${{ github.run_attempt }}"
          target_commitish: ${{ github.sha }}
          name: "Pre-release ${{ github.ref_name }} #${{ github.run_number }}"
          prerelease: true
          body: |
            Automated pre-release build.

            Branch/ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: #${{ github.run_number }}

          files: |
            dist/*.jar
